# ===== 基础设置 =====
baseURL = 'https://4yeo-blog.3561203756.workers.dev/'
locale = 'zh-cn'
title = '4yeo'
theme = 'PaperMod'

# ===== 分页 =====
[pagination]
  pagerSize = 10

# ===== 代码高亮 =====
[markup]
  [markup.highlight]
    style = 'monokai'
    lineNos = true

# ===== 菜单 =====
[[menu.main]]
  name = '归档'
  url = '/archives/'
  weight = 10

[[menu.main]]
  name = '标签'
  url = '/tags/'
  weight = 20

[[menu.main]]
  name = '搜索'
  url = '/search/'
  weight = 30

# ===== PaperMod 个性化 =====
[params]
  # 首页显示
  [params.homeInfoParams]
    Title = 'Hi，欢迎 👋'
    Content = '一个记录技术与生活的博客。'

  # 社交媒体图标
  [params.socialIcons]
    [params.socialIcons.github]
      name = 'GitHub'
      url = 'https://github.com/你的用户名'

  # 显示元信息
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  TocOpen = true

  # 日期格式（PaperMod 要求字符串格式）
  DateFormat = '2006-01-02'
